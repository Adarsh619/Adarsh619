<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" role="img" aria-label="Thanks for stopping by. Learn, build, test, ship, improve.">
<defs><filter id="fblur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter><pattern id="fdots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#ffffff" opacity=".16"/></pattern><radialGradient id="ffade" cx="50%" cy="40%" r="70%"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient><mask id="fmask"><rect width="100%" height="100%" fill="url(#ffade)"/></mask><clipPath id="c"><rect width="1200" height="200" rx="24"/></clipPath>
<linearGradient id="t" x1="0" x2="1"><stop offset="0" stop-color="#7c8cff"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs>
<style>.fa1{animation:fa1 14s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}@keyframes fa1{0%{transform:translate(-6%,0) scale(1)}50%{transform:translate(8%,10%) scale(1.15)}100%{transform:translate(-2%,-6%) scale(.9)}}.fa2{animation:fa2 18s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}@keyframes fa2{0%{transform:translate(-6%,0) scale(1)}50%{transform:translate(8%,10%) scale(1.15)}100%{transform:translate(-2%,-6%) scale(.9)}}.fa3{animation:fa3 16s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}@keyframes fa3{0%{transform:translate(-6%,0) scale(1)}50%{transform:translate(8%,10%) scale(1.15)}100%{transform:translate(-2%,-6%) scale(.9)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<g clip-path="url(#c)"><rect width="1200" height="200" fill="#07080d"/><g filter="url(#fblur)"><ellipse class="fa1" cx="216" cy="30" rx="384" ry="58" fill="#7c8cff" opacity="0.28"/><ellipse class="fa2" cx="660" cy="10" rx="360" ry="54" fill="#a78bfa" opacity="0.28"/><ellipse class="fa3" cx="1020" cy="60" rx="312" ry="47" fill="#22d3ee" opacity="0.28"/></g><rect width="1200" height="200" fill="#07080d" opacity=".5"/><rect width="100%" height="100%" fill="url(#fdots)" mask="url(#fmask)"/></g>
<rect x=".5" y=".5" width="1199" height="199" rx="24" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
<text x="600.0" y="92" text-anchor="middle" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="800" fill="#f0f6fc">Thanks for stopping by.</text>
<text x="600.0" y="136" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace" font-size="18" fill="url(#t)">learn → build → test → ship → improve</text>
</svg>