</g>

<text class="fade d1" x="64" y="172" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="800" fill="url(#name)">Hi, I’m Adarsh Pradhan.</text>
<text class="fade d2" x="64" y="248" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="56" font-weight="800" fill="#e6edf3">I build</text>
<g class="fade d2"><text class="rw rw0" x="64" y="248" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="56" font-weight="800"><tspan fill="none">I build </tspan><tspan fill="url(#hgrad)">RAG apps.</tspan></text><text class="rw rw1" x="64" y="248" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="56" font-weight="800"><tspan fill="none">I build </tspan><tspan fill="url(#hgrad)">dashboards.</tspan></text><text class="rw rw2" x="64" y="248" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="56" font-weight="800"><tspan fill="none">I build </tspan><tspan fill="url(#hgrad)">map experiences.</tspan></text><text class="rw rw3" x="64" y="248" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="56" font-weight="800"><tspan fill="none">I build </tspan><tspan fill="url(#hgrad)">clean UIs.</tspan></text></g>

<text class="fade d3" x="64" y="306" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#9aa4b2">Frontend &amp; Full-Stack Developer. I ship local RAG, vector search and polished</text>
<text class="fade d3" x="64" y="334" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#9aa4b2">interfaces — backed by real support and recruiting experience.</text>

