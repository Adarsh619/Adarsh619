<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-label="Adarsh Pradhan — Frontend and Full-Stack Developer">
<title>Adarsh Pradhan — Frontend and Full-Stack Developer</title>
<defs>
<filter id="hblur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter><pattern id="hdots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#ffffff" opacity=".16"/></pattern><radialGradient id="hfade" cx="50%" cy="40%" r="70%"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient><mask id="hmask"><rect width="100%" height="100%" fill="url(#hfade)"/></mask><linearGradient id="psb" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c8cff" stop-opacity="0"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient>
<linearGradient id="hgrad" x1="280" y1="0" x2="760" y2="0" gradientUnits="userSpaceOnUse">
  <stop offset="0" stop-color="#7c8cff"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee"/>
</linearGradient>
<linearGradient id="name" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="reflect">
  <stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#ffffff"/><stop offset=".6" stop-color="#c7d0ff"/><stop offset=".75" stop-color="#ffffff"/>
  <animateTransform attributeName="gradientTransform" type="translate" from="-600 0" to="600 0" dur="5s" repeatCount="indefinite"/>
</linearGradient>
<linearGradient id="edge" x1="0" x2="1"><stop offset="0" stop-color="#07080d"/><stop offset=".08" stop-color="#07080d" stop-opacity="0"/><stop offset=".92" stop-color="#07080d" stop-opacity="0"/><stop offset="1" stop-color="#07080d"/></linearGradient>
<clipPath id="card"><rect width="1200" height="470" rx="24"/></clipPath>
</defs>
<style>
    .ha1{animation:ha1 14s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}@keyframes ha1{0%{transform:translate(-6%,0) scale(1)}50%{transform:translate(8%,10%) scale(1.15)}100%{transform:translate(-2%,-6%) scale(.9)}}.ha2{animation:ha2 18s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}@keyframes ha2{0%{transform:translate(-6%,0) scale(1)}50%{transform:translate(8%,10%) scale(1.15)}100%{transform:translate(-2%,-6%) scale(.9)}}.ha3{animation:ha3 16s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}@keyframes ha3{0%{transform:translate(-6%,0) scale(1)}50%{transform:translate(8%,10%) scale(1.15)}100%{transform:translate(-2%,-6%) scale(.9)}}
    .rw0{animation:rw0 12s infinite}@keyframes rw0{0%{opacity:1;transform:none}3.00%,22.00%{opacity:1;transform:translateY(0)}25.00%,100%{opacity:0;transform:translateY(-24px)}}.rw1{animation:rw1 12s infinite}@keyframes rw1{0%,24.99%{opacity:0;transform:translateY(24px)}28.00%,47.00%{opacity:1;transform:translateY(0)}50.00%,100%{opacity:0;transform:translateY(-24px)}}.rw2{animation:rw2 12s infinite}@keyframes rw2{0%,49.99%{opacity:0;transform:translateY(24px)}53.00%,72.00%{opacity:1;transform:translateY(0)}75.00%,100%{opacity:0;transform:translateY(-24px)}}.rw3{animation:rw3 12s infinite}@keyframes rw3{0%,74.99%{opacity:0;transform:translateY(24px)}78.00%,97.00%{opacity:1;transform:translateY(0)}100.00%,100%{opacity:0;transform:translateY(-24px)}}
    .rw{opacity:0;transform-box:fill-box}
    .loop{animation:loop 40s linear infinite}
    @keyframes loop{to{transform:translateX(-2100px)}}
    .pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes pulse{50%{opacity:.35;transform:scale(1.8)}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}.rw0{opacity:1}}
    </style>
<g clip-path="url(#card)">
<rect width="1200" height="470" fill="#07080d"/>
<g filter="url(#hblur)"><ellipse class="ha1" cx="216" cy="70" rx="384" ry="135" fill="#7c8cff" opacity="0.39"/><ellipse class="ha2" cx="660" cy="24" rx="360" ry="127" fill="#a78bfa" opacity="0.39"/><ellipse class="ha3" cx="1020" cy="141" rx="312" ry="110" fill="#22d3ee" opacity="0.39"/></g>
